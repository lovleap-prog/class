<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글날 자음 뽑기</title>
<!-- 픽셀 한글 폰트(인터넷 연결 시 적용, 없으면 기본 폰트로 표시) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{
    --gui:#c6c6c6;        /* 마크 GUI 회색 */
    --gui-dark:#373737;
    --slot:#8b8b8b;
    --gold:#ffd83d;       /* 마크 타이틀 노랑 */
    --white:#ffffff;
    --shadow:#3f3f3f;
    --green:#5ba528;
    --green-dark:#3b6d1a;
    --px:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}

  body{
    font-family:'Galmuri11','DungGeunMo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--white);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px 34px;
    background-color:#5b4029;
    background-size:96px 96px;
    image-rendering:pixelated;
    overflow-x:hidden;
    text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.55);
  }
  body::before{ /* 어둡게 깔아주는 오버레이 */
    content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);pointer-events:none;z-index:0;
  }
  body > *{position:relative;z-index:1}

  /* ---------- 타이틀 ---------- */
  header{text-align:center;margin-bottom:10px;position:relative}
  h1{
    font-size:clamp(22px,4.6vw,44px);letter-spacing:2px;line-height:1.3;
    color:var(--white);
  }
  h1 .em{color:var(--gold)}
  .splash{
    display:inline-block;color:var(--gold);font-size:clamp(11px,2vw,16px);
    transform:rotate(-14deg);margin-top:8px;
    animation:bob .6s ease-in-out infinite alternate;
  }
  @keyframes bob{from{transform:rotate(-14deg) scale(1)}to{transform:rotate(-14deg) scale(1.12)}}
  .mission{margin-top:18px;font-size:clamp(11px,2.1vw,16px);color:#f0f0f0}

  /* ---------- 마크 GUI 패널 ---------- */
  .panel{
    background-color:var(--gui);background-size:64px 64px;
    box-shadow:
      inset var(--px) var(--px) 0 rgba(255,255,255,.55),
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.4),
      0 0 0 var(--px) #1d1d1d, 0 10px 0 rgba(0,0,0,.35);
    padding:clamp(14px,3vw,26px);
    margin-top:16px;width:min(800px,100%);
  }

  /* ---------- 마크 버튼 ---------- */
  .mc-btn{
    font:inherit;color:var(--white);cursor:pointer;display:inline-block;
    background-color:#8a8a8a;background-size:64px 64px;
    border:0;padding:14px 22px;
    font-size:clamp(13px,2.2vw,19px);letter-spacing:1px;
    text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.6);
    box-shadow:
      inset var(--px) var(--px) 0 rgba(255,255,255,.45),
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.45),
      0 0 0 var(--px) #1d1d1d;
    transition:filter .1s;
  }
  .mc-btn:hover:not(:disabled){filter:brightness(1.22) saturate(1.2)}
  .mc-btn:active:not(:disabled){
    box-shadow:
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,255,255,.35),
      inset var(--px) var(--px) 0 rgba(0,0,0,.45),
      0 0 0 var(--px) #1d1d1d;
    transform:translateY(2px);
  }
  .mc-btn:disabled{filter:grayscale(.6) brightness(.75);cursor:not-allowed}
  .mc-btn.primary{background-color:var(--green)}
  .mc-btn[aria-pressed="true"]{background-color:var(--green);outline:var(--px) solid var(--gold);outline-offset:var(--px)}

  .modes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

  /* ---------- 슬롯(인벤토리 칸) ---------- */
  .stage{
    display:flex;gap:clamp(14px,4vw,36px);justify-content:center;flex-wrap:wrap;
    margin:22px 0 4px;perspective:900px;
  }
  .slot{display:flex;flex-direction:column;align-items:center;gap:9px}
  .slot-label{font-size:clamp(10px,1.8vw,14px);color:#ffffff;letter-spacing:1px}
  .card{
    width:clamp(126px,29vw,200px);height:clamp(126px,29vw,200px);
    display:flex;align-items:center;justify-content:center;
    background-color:var(--slot);background-size:64px 64px;
    box-shadow:
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,255,255,.5),
      inset var(--px) var(--px) 0 rgba(0,0,0,.5),
      0 0 0 var(--px) #1d1d1d;
    transform-style:preserve-3d;position:relative;
  }
  .card canvas{width:74%;height:74%}
  .card.active{outline:var(--px) solid var(--gold);outline-offset:var(--px)}
  .name{
    font-size:clamp(13px,2.4vw,20px);color:var(--gold);
    min-height:1.4em;letter-spacing:2px;
  }

  /* 뱅글뱅글 회전 */
  .card.spinning{animation:spin3d .42s linear infinite}
  @keyframes spin3d{
    0%{transform:rotateY(0) scale(1)}
    50%{transform:rotateY(180deg) scale(1.06)}
    100%{transform:rotateY(360deg) scale(1)}
  }
  .card.landed{animation:land .5s steps(4,end)}
  @keyframes land{
    0%{transform:scale(1.3)}
    40%{transform:scale(.92)}
    70%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }

  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .controls .mc-btn{padding:16px 32px;font-size:clamp(15px,2.8vw,24px)}

  .options{
    display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px;
    font-size:clamp(10px,1.8vw,14px);color:#ffffff;
  }
  .options label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .options input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}

  /* ---------- 핫바(기록) ---------- */
  .hotbar-wrap{margin-top:22px;text-align:center}
  .hotbar-wrap h2{font-size:clamp(10px,1.8vw,14px);color:#dcdcdc;letter-spacing:2px;margin-bottom:10px}
  .hotbar{
    display:inline-flex;gap:0;padding:var(--px);
    background-color:#8a8a8a;background-size:64px 64px;
    box-shadow:
      inset var(--px) var(--px) 0 rgba(255,255,255,.5),
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.4),
      0 0 0 var(--px) #1d1d1d;
    max-width:100%;flex-wrap:wrap;justify-content:center;
  }
  .cell{
    width:clamp(46px,9vw,64px);height:clamp(46px,9vw,64px);margin:var(--px);
    background-color:var(--slot);
    display:flex;align-items:center;justify-content:center;gap:2px;
    box-shadow:
      inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,255,255,.45),
      inset var(--px) var(--px) 0 rgba(0,0,0,.45);
  }
  .cell canvas{width:42%;height:42%}
  .cell.newest{outline:2px solid var(--gold);outline-offset:-2px}

  .hint{margin-top:18px;font-size:clamp(9px,1.6vw,12px);color:#bdbdbd;text-align:center}
  .hint kbd{
    background:#5a5a5a;padding:2px 7px;color:#fff;text-shadow:none;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.4);
  }


  /* ---------- 예시 낱말(마크 툴팁 느낌) ---------- */
  .hint-box{margin-top:18px;text-align:center}
  .book{
    margin:14px auto 0;max-width:620px;text-align:left;
    background:#170a21;padding:14px 16px;
    box-shadow:
      inset 0 0 0 var(--px) #3b1e6e,
      inset 0 0 0 calc(var(--px)*2) #170a21,
      0 0 0 var(--px) #0b0410;
  }
  .book-title{color:#ffffff;font-size:clamp(12px,2vw,16px);margin-bottom:10px;letter-spacing:1px}
  .book-title b{color:var(--gold)}
  .book-list{list-style:none;display:flex;flex-direction:column;gap:9px}
  .book-list li{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;line-height:1.5}
  .bw{color:var(--gold);font-size:clamp(14px,2.6vw,20px)}
  .bm{color:#cfcfcf;font-size:clamp(10px,1.9vw,14px)}
  .bt{
    color:#55ffff;font-size:clamp(9px,1.6vw,12px);
    border:2px solid rgba(85,255,255,.45);padding:1px 6px;
  }
  .book-foot{margin-top:12px;color:#a9a9a9;font-size:clamp(9px,1.6vw,12px)}

  /* 픽셀 파티클 */
  .pix{position:fixed;width:10px;height:10px;pointer-events:none;z-index:40;animation:fly .85s steps(8,end) forwards}
  @keyframes fly{
    0%{opacity:1;transform:translate(0,0)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy))}
  }
  @media (prefers-reduced-motion:reduce){
    .card.spinning,.card.landed,.pix,.splash{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>

<header>
  <h1>⛏ 한글날 <span class="em">자음 뽑기</span></h1>
  <div class="splash" id="splash">한글 최고!</div>
  <p class="mission">뽑은 자음 2개가 들어간 낱말을 말하거나 그려보세요!</p>
</header>

<div class="panel">
  <div class="modes">
    <button class="mc-btn" id="modeTwo" aria-pressed="true">2개 한번에 뽑기</button>
    <button class="mc-btn" id="modeOne" aria-pressed="false">하나씩 뽑기</button>
  </div>

  <div class="stage">
    <div class="slot">
      <div class="slot-label">첫 번째 자음</div>
      <div class="card" id="card0"><canvas id="cv0" width="10" height="10"></canvas></div>
      <div class="name" id="name0">???</div>
    </div>
    <div class="slot">
      <div class="slot-label">두 번째 자음</div>
      <div class="card" id="card1"><canvas id="cv1" width="10" height="10"></canvas></div>
      <div class="name" id="name1">???</div>
    </div>
  </div>

  <div class="controls">
    <button class="mc-btn primary" id="drawBtn">자음 뽑기!</button>
    <button class="mc-btn" id="resetBtn">초기화</button>
  </div>


  <div class="hint-box">
    <button class="mc-btn" id="hintBtn" disabled>💡 예시 낱말 보기</button>
    <div class="book" id="book" hidden>
      <div class="book-title" id="bookTitle"></div>
      <ul class="book-list" id="bookList"></ul>
      <div class="book-foot">두 자음이 모두 들어가면 몇 글자든 좋아요! (예: ㅅ + ㅈ → 세종대왕)</div>
    </div>
  </div>

  <div class="options">
    <label><input type="checkbox" id="optDup"> 같은 자음 중복 허용</label>
    <label><input type="checkbox" id="optSound" checked> 효과음</label>
  </div>
</div>

<div class="hotbar-wrap">
  <h2>최근 뽑은 자음</h2>
  <div class="hotbar" id="hotbar"></div>
</div>

<p class="hint"><kbd>Space</kbd> 뽑기 · <kbd>R</kbd> 초기화 · <kbd>F</kbd> 전체화면 · <kbd>H</kbd> 예시 낱말</p>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. 자음 도트 글리프 (9x9 픽셀, 쌍자음 제외 14개)
     ========================================================= */
  const G = {
    "ㄱ": ["#########","........#","........#","........#","........#","........#","........#","........#","........#"],
    "ㄴ": ["#........","#........","#........","#........","#........","#........","#........","#........","#########"],
    "ㄷ": ["#########","#........","#........","#........","#........","#........","#........","#........","#########"],
    "ㄹ": ["#########","........#","........#","........#","#########","#........","#........","#........","#########"],
    "ㅁ": ["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],
    "ㅂ": ["#.......#","#.......#","#.......#","#.......#","#########","#.......#","#.......#","#.......#","#########"],
    "ㅅ": ["....#....","....#....","...#.#...","...#.#...","..#...#..","..#...#..",".#.....#.",".#.....#.","#.......#"],
    "ㅇ": ["...###...","..#...#..",".#.....#.","#.......#","#.......#","#.......#",".#.....#.","..#...#..","...###..."],
    "ㅈ": ["#########","....#....","...#.#...","...#.#...","..#...#..","..#...#..",".#.....#.",".#.....#.","#.......#"],
    "ㅊ": ["....#....","#########","....#....","...#.#...","...#.#...","..#...#..","..#...#..",".#.....#.","#.......#"],
    "ㅋ": ["#########","........#","........#","........#","#########","........#","........#","........#","........#"],
    "ㅌ": ["#########","#........","#........","#........","#########","#........","#........","#........","#########"],
    "ㅍ": ["#########","..#...#..","..#...#..","..#...#..","..#...#..","..#...#..","..#...#..","..#...#..","#########"],
    "ㅎ": ["....#....","#########","...###...","..#...#..",".#.....#.",".#.....#.",".#.....#.","..#...#..","...###..."]
  };

  const CONSONANTS = [
    { ch: "ㄱ", name: "기역" }, { ch: "ㄴ", name: "니은" },
    { ch: "ㄷ", name: "디귿" }, { ch: "ㄹ", name: "리을" },
    { ch: "ㅁ", name: "미음" }, { ch: "ㅂ", name: "비읍" },
    { ch: "ㅅ", name: "시옷" }, { ch: "ㅇ", name: "이응" },
    { ch: "ㅈ", name: "지읒" }, { ch: "ㅊ", name: "치읓" },
    { ch: "ㅋ", name: "키읔" }, { ch: "ㅌ", name: "티읕" },
    { ch: "ㅍ", name: "피읖" }, { ch: "ㅎ", name: "히읗" }
  ];

  // 캔버스는 10x10 (9x9 글리프 + 1px 마크식 그림자), CSS가 픽셀 그대로 확대
  function drawGlyph(cv, ch, color) {
    const g = cv.getContext("2d");
    g.clearRect(0, 0, 10, 10);
    const pat = G[ch];
    if (!pat) return;
    for (let pass = 0; pass < 2; pass++) {
      g.fillStyle = pass === 0 ? "rgba(0,0,0,.55)" : (color || "#ffffff");
      const off = pass === 0 ? 1 : 0;
      for (let y = 0; y < 9; y++)
        for (let x = 0; x < 9; x++)
          if (pat[y][x] === "#") g.fillRect(x + off, y + off, 1, 1);
    }
  }

  /* =========================================================
     2. 블록 텍스처 생성 (흙 / 돌 / 나무) — 외부 이미지 없음
     ========================================================= */
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
  function tex(paint) {
    const c = document.createElement("canvas");
    c.width = c.height = 16;
    paint(c.getContext("2d"), rng(20251009));
    return "url(" + c.toDataURL() + ")";
  }
  const dirtTex = tex((g, r) => {
    const p = ["#866043", "#79553a", "#6b4a31", "#8f6a4a", "#5e4029"];
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      g.fillStyle = p[Math.floor(r() * p.length)]; g.fillRect(x, y, 1, 1);
    }
  });
  const stoneTex = tex((g, r) => {
    const p = ["#7d7d7d", "#8a8a8a", "#727272", "#949494", "#6b6b6b"];
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      g.fillStyle = p[Math.floor(r() * p.length)]; g.fillRect(x, y, 1, 1);
    }
  });
  const plankTex = tex((g, r) => {
    const p = ["#b8945f", "#a9854f", "#c1a06c", "#9d7a47"];
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      g.fillStyle = p[Math.floor(r() * p.length)]; g.fillRect(x, y, 1, 1);
    }
    g.fillStyle = "#6f5531";                       // 판자 경계선
    g.fillRect(0, 3, 16, 1); g.fillRect(0, 11, 16, 1);
    g.fillRect(7, 0, 1, 4); g.fillRect(3, 4, 1, 7); g.fillRect(12, 12, 1, 4);
  });

  document.body.style.backgroundImage = dirtTex;
  document.querySelectorAll(".panel, .hotbar").forEach((el) => { el.style.backgroundImage = plankTex; });
  document.querySelectorAll(".mc-btn, .card, .cell").forEach((el) => { el.style.backgroundImage = stoneTex; });


  /* =========================================================
     3. 예시 낱말 사전 (오프라인 내장 — 인터넷/로그인 불필요)
        [낱말, 뜻, 갈래]
     ========================================================= */
  const WORDS = [
["한글","세종대왕이 만든 우리 글자의 이름","한글날"],
["닿소리","'자음'을 가리키는 순우리말","한글날"],
["홀소리","'모음'을 가리키는 순우리말","한글날"],
["첫소리","글자의 맨 앞에 오는 자음(초성)","한글날"],
["끝소리","글자의 끝에 붙는 자음(종성)","한글날"],
["받침","글자 아래에 붙여 쓰는 자음","한글날"],
["낱말","뜻을 지닌 말의 가장 작은 덩어리","한글날"],
["글월","글이나 문장을 이르는 말","한글날"],
["글씨","써 놓은 글자의 모양","한글날"],
["말씀","'말'을 높여 이르는 말","한글날"],
["훈민정음","한글의 첫 이름, '백성을 가르치는 바른 소리'","한글날"],
["세종대왕","한글을 만드신 조선의 임금","한글날"],
["집현전","세종대왕이 학자들과 공부하던 곳","한글날"],
["백성","나라의 사람들을 이르던 옛말","한글날"],
["붓글씨","붓으로 쓴 글씨","한글날"],
["두루마리","둘둘 말아 놓은 종이","순우리말"],
["이야기","겪은 일이나 생각을 말로 풀어내는 것","우리말"],
["목소리","목에서 나오는 소리","순우리말"],
["노래","가락에 맞추어 부르는 소리","순우리말"],
["배움","새로운 것을 익히는 일","순우리말"],
["가르침","남을 이끌어 알게 해 주는 일","순우리말"],
["슬기","이치를 밝게 헤아리는 재주(지혜)","순우리말"],
["어울림","서로 잘 어우러지는 것","순우리말"],
["나눔","함께 나누어 가지는 일","순우리말"],
["보람","한 일에서 얻는 좋은 결과나 기쁨","순우리말"],

["하늘","해와 달과 별이 있는 넓은 곳","순우리말"],
["가람","'강'을 뜻하는 옛 우리말","순우리말"],
["미르","'용'을 뜻하는 옛 우리말","순우리말"],
["나래","'날개'를 정답게 이르는 말","순우리말"],
["노을","해 질 무렵 하늘이 붉게 물드는 것","순우리말"],
["이슬","풀잎에 맺힌 작은 물방울","순우리말"],
["무지개","비 온 뒤 하늘에 뜨는 일곱 빛깔 띠","순우리말"],
["샛별","새벽 동쪽 하늘에 뜨는 별","순우리말"],
["별빛","별에서 비치는 빛","순우리말"],
["달빛","달에서 비치는 빛","순우리말"],

["치킨","닭을 튀겨 만든 음식","외래어"],
["후추","맵고 향이 나는 양념","우리말"],
["켜켜이","여러 켜로 겹겹이","순우리말"],
["핫케이크","둥글고 도톰하게 구운 빵","외래어"],
["통통","작고 볼록하게 살이 오른 모양","순우리말"],
["해파리","바다에 사는 투명한 동물","순우리말"],
["흙투성이","흙이 잔뜩 묻은 모습","순우리말"],
["조각칼","나무나 돌을 새길 때 쓰는 칼","우리말"],
["하하호호","크게 웃는 소리","순우리말"],
["칼춤","칼을 들고 추는 춤","순우리말"],
["코뿔소","코 위에 뿔이 난 큰 동물","순우리말"]
  ];

  // 한글 낱자 분해 (쌍자음·겹받침은 기본 자음으로 풀어서 본다)
  const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  const BASE = {"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ","ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ",
                "ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ"};

  function jamoOf(word) {
    const out = [];
    for (const c of word) {
      const code = c.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) continue;
      [CHO[Math.floor(code / 588)], JONG[code % 28]].forEach((j) => {
        if (!j) return;
        for (const x of (BASE[j] || j)) out.push(x);
      });
    }
    return out;
  }

  const DICT = WORDS.map((w) => ({ w: w[0], m: w[1], t: w[2], j: jamoOf(w[0]) }));
  const RANK = { "한글날": 0, "순우리말": 1, "우리말": 2, "외래어": 3 };

  function matches(a, b) {
    return DICT.filter((e) =>
      a === b ? e.j.filter((x) => x === a).length >= 2
              : e.j.indexOf(a) >= 0 && e.j.indexOf(b) >= 0);
  }
  function examplesFor(a, b, n) {
    const pool = matches(a, b).slice();
    for (let i = pool.length - 1; i > 0; i--) {      // 섞은 뒤
      const k = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[k]] = [pool[k], pool[i]];
    }
    pool.sort((x, y) => RANK[x.t] - RANK[y.t]);      // 한글날·순우리말 먼저
    return { list: pool.slice(0, n), total: pool.length };
  }

  /* =========================================================
     4. 앱 로직
     ========================================================= */
  const $ = (id) => document.getElementById(id);
  const cards = [$("card0"), $("card1")];
  const canvases = [$("cv0"), $("cv1")];
  const names = [$("name0"), $("name1")];
  const drawBtn = $("drawBtn"), resetBtn = $("resetBtn"), hotbar = $("hotbar");
  const optDup = $("optDup"), optSound = $("optSound");
  const hintBtn = $("hintBtn"), book = $("book"), bookTitle = $("bookTitle"), bookList = $("bookList");
  const modeTwo = $("modeTwo"), modeOne = $("modeOne");

  let mode = "two";
  let results = [null, null];
  let busy = false;
  const history = [];

  const SPLASHES = ["한글 최고!", "쌍자음은 없어요!", "크리퍼 조심!", "자음 14개 뽑기!",
                    "다이아몬드 발견!", "세종대왕 님 감사합니다!", "블록처럼 조립하는 한글!"];
  $("splash").textContent = SPLASHES[Math.floor(Math.random() * SPLASHES.length)];

  /* ---- 효과음 ---- */
  let ac = null;
  function audio() {
    if (!optSound.checked) return null;
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq, dur, type, vol) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  }
  const tick = () => beep(380 + Math.random() * 240, 0.035, "square", 0.03);
  function levelUp() {   // 마크 레벨업 느낌
    [[523, 0], [784, 90], [1046, 190]].forEach(([f, d]) =>
      setTimeout(() => beep(f, 0.2, "triangle", 0.09), d));
  }

  /* ---- 픽셀 파티클 ---- */
  function burst(el) {
    const r = el.getBoundingClientRect();
    const colors = ["#ffd83d", "#5ba528", "#ffffff", "#b8945f", "#7d7d7d"];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("div");
      s.className = "pix";
      s.style.background = colors[i % colors.length];
      s.style.left = (r.left + r.width / 2) + "px";
      s.style.top = (r.top + r.height / 2) + "px";
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 120;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  function pick(exclude) {
    let pool = CONSONANTS;
    if (exclude && !optDup.checked) {
      const rest = CONSONANTS.filter((c) => c.ch !== exclude.ch);
      if (rest.length) pool = rest;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // 뱅글뱅글 돌다가 점점 느려지며 target에서 멈춤
  function spin(index, target, duration) {
    return new Promise((resolve) => {
      const card = cards[index], cv = canvases[index];
      card.classList.remove("landed");
      card.classList.add("spinning", "active");
      names[index].textContent = "???";

      const start = performance.now();
      let last = 0;

      function frame(now) {
        const t = Math.min((now - start) / duration, 1);
        const gap = 40 + (260 - 40) * (t * t);   // 40ms → 260ms
        if (now - last >= gap) {
          last = now;
          drawGlyph(cv, CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)].ch, "#ffffff");
          tick();
        }
        if (t < 1) { requestAnimationFrame(frame); return; }

        card.classList.remove("spinning");
        drawGlyph(cv, target.ch, "#ffd83d");
        names[index].textContent = target.name;
        void card.offsetWidth;
        card.classList.add("landed");
        burst(card);
        levelUp();
        setTimeout(() => card.classList.remove("active"), 700);
        resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  function renderHotbar() {
    hotbar.innerHTML = "";
    const count = Math.max(history.length, 5);
    for (let i = 0; i < count; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.backgroundImage = stoneTex;
      const pair = history[i];
      if (pair) {
        if (i === 0) cell.classList.add("newest");
        pair.forEach((ch) => {
          const cv = document.createElement("canvas");
          cv.width = cv.height = 10;
          cell.appendChild(cv);
          drawGlyph(cv, ch, "#ffffff");
        });
      }
      hotbar.appendChild(cell);
    }
  }

  function addHistory() {
    if (!results[0] || !results[1]) return;
    history.unshift([results[0].ch, results[1].ch]);
    if (history.length > 5) history.pop();
    renderHotbar();
  }

  function hideBook() {
    book.hidden = true;
    bookList.innerHTML = "";
    hintBtn.textContent = "💡 예시 낱말 보기";
  }

  function showExamples() {
    if (!results[0] || !results[1]) return;
    const a = results[0].ch, b = results[1].ch;
    const { list, total } = examplesFor(a, b, 3);

    bookTitle.innerHTML = "<b>" + a + "</b> + <b>" + b + "</b> 가 모두 들어간 낱말" +
      (total > list.length ? " (모두 " + total + "개 중 " + list.length + "개)" : "");
    bookList.innerHTML = "";
    if (!list.length) {
      const li = document.createElement("li");
      li.innerHTML = '<span class="bm">딱 맞는 낱말이 없어요. 두 자음으로 그림을 그려 볼까요?</span>';
      bookList.appendChild(li);
    }
    list.forEach((e) => {
      const li = document.createElement("li");
      const w = document.createElement("span"); w.className = "bw"; w.textContent = e.w;
      const t = document.createElement("span"); t.className = "bt"; t.textContent = e.t;
      const m = document.createElement("span"); m.className = "bm"; m.textContent = e.m;
      li.append(w, t, m);
      bookList.appendChild(li);
    });
    book.hidden = false;
    hintBtn.textContent = "🔄 다른 예시 보기";
    beep(660, 0.1, "triangle", 0.06);
  }

  function updateButton() {
    const ready = !!(results[0] && results[1]);
    hintBtn.disabled = busy || !ready;
    if (busy) { drawBtn.disabled = true; return; }
    drawBtn.disabled = false;
    if (mode === "two") {
      drawBtn.textContent = results[0] ? "다시 뽑기!" : "자음 뽑기!";
    } else if (!results[0]) drawBtn.textContent = "첫 번째 뽑기";
    else if (!results[1]) drawBtn.textContent = "두 번째 뽑기";
    else drawBtn.textContent = "다시 뽑기!";
  }

  function reset(silent) {
    results = [null, null];
    for (let i = 0; i < 2; i++) {
      cards[i].classList.remove("spinning", "landed", "active");
      canvases[i].getContext("2d").clearRect(0, 0, 10, 10);
      names[i].textContent = "???";
    }
    hideBook();
    if (!silent) beep(300, 0.08, "sine", 0.05);
    updateButton();
  }

  async function draw() {
    if (busy) return;
    if (results[0] && results[1]) reset(true);
    hideBook();
    busy = true; updateButton();

    if (mode === "two") {
      const a = pick(null), b = pick(a);
      results = [a, b];
      await Promise.all([spin(0, a, 2000), spin(1, b, 2900)]);
      addHistory();
    } else {
      const slot = results[0] ? 1 : 0;
      const target = pick(slot === 1 ? results[0] : null);
      results[slot] = target;
      await spin(slot, target, 2300);
      if (slot === 1) addHistory();
    }

    busy = false; updateButton();
  }

  function setMode(next) {
    if (busy || mode === next) return;
    mode = next;
    modeTwo.setAttribute("aria-pressed", String(next === "two"));
    modeOne.setAttribute("aria-pressed", String(next === "one"));
    reset(true);
  }

  drawBtn.addEventListener("click", draw);
  hintBtn.addEventListener("click", showExamples);
  resetBtn.addEventListener("click", () => { if (!busy) reset(false); });
  modeTwo.addEventListener("click", () => setMode("two"));
  modeOne.addEventListener("click", () => setMode("one"));

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); draw(); }
    else if (e.key === "r" || e.key === "R") { if (!busy) reset(false); }
    else if (e.key === "h" || e.key === "H") { if (!hintBtn.disabled) showExamples(); }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });

  renderHotbar();
  updateButton();
})();
</script>
</body>
</html>
