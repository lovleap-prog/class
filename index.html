<!DOCTYPE html>
<!--
  저장소 뿌리에 두는 안내 겸 되보내기 장.

  지금은 이 파일이 쓰이지 않는다. 넷리파이는 app/ 을 사이트 뿌리로 삼고,
  깃허브 페이지는 액션으로 app/ 만 떼어 올리기 때문이다(.github/workflows/pages.yml).

  남겨두는 까닭은 하나다. 액션이 무슨 일로 못 돌아 페이지를 '가지에서 바로 내주기'
  로 되돌려야 할 때, 저장소 뿌리가 그대로 나가면서 앱이 /app/ 아래에 숨는다.
  그때 주소 끝에 app 을 붙여야 하는 것을 모르고 빈 화면을 보는 일이 없도록
  여기서 바로 넘겨준다. 있어도 해가 없는 갓길이다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교육활동</title>
  <meta http-equiv="refresh" content="0; url=./app/">
  <link rel="canonical" href="./app/">
  <style>
    body { font-family: system-ui, -apple-system, "맑은 고딕", sans-serif;
           display: grid; place-items: center; min-height: 100vh; margin: 0;
           background: #f5f7fa; color: #1a1f27; }
    @media (prefers-color-scheme: dark) { body { background: #12161c; color: #e6eaf0; } }
    a { color: #2f6fed; }
  </style>
</head>
<body>
  <p>교육활동 앱으로 넘어갑니다. 안 넘어가면 <a href="./app/">여기를 누르세요</a>.</p>
  <script>location.replace('./app/');</script>
</body>
</html>
