<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>건강한 점심 식단 만들기</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CATEGORY_MAP = {
      grain: { title: '곡류', bg: 'bg-yellow-100', border: 'border-yellow-300', text: 'text-yellow-700' },
      veg: { title: '채소류', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-700' },
      protein: { title: '단백질류', bg: 'bg-red-100', border: 'border-red-300', text: 'text-red-700' },
      fruit: { title: '과일류', bg: 'bg-orange-100', border: 'border-orange-300', text: 'text-orange-700' },
      dairy: { title: '유제품류', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-700' },
      sugar: { title: '유지·당류', bg: 'bg-gray-200', border: 'border-gray-300', text: 'text-gray-700' },
      unknown: { title: '분석불가', bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-700' }
    };

    // API 키를 코드에 적어두지 않습니다.
    // 저장소에 올라가면 누구나 꺼내 쓸 수 있고, 그대로 요금이 청구되기 때문입니다.
    // 대신 실행할 때 한 번 입력받아 이 브라우저에만 보관합니다.
    const KEY_STORAGE = 'diet.geminiApiKey';

    const readKey = () => {
      try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; }
    };
    const writeKey = (v) => {
      // 시크릿 모드 등에서 저장이 막혀도 앱은 계속 돌아가야 한다.
      try {
        if (v) localStorage.setItem(KEY_STORAGE, v);
        else localStorage.removeItem(KEY_STORAGE);
      } catch (e) { /* 저장 실패는 무시 — 이번 실행 동안만 쓰게 된다 */ }
    };

    const friendlyError = (msg) => {
      if (msg === "API_KEY_EMPTY") return "API 키가 없습니다. 오른쪽 위 [API 키] 버튼에서 넣어주세요.";
      if (msg === "API_KEY_INVALID") return "API 키가 올바르지 않습니다. 오른쪽 위 [API 키] 버튼에서 다시 확인해 주세요.";
      return msg;
    };

    function App() {
      const [tray, setTray] = useState([]);
      const [isPerfect, setIsPerfect] = useState(false);
      const [inputValue, setInputValue] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [evaluation, setEvaluation] = useState(""); 
      const [isEvaluating, setIsEvaluating] = useState(false); 
      const [apiKey, setApiKey] = useState(readKey);
      const [showKeyForm, setShowKeyForm] = useState(false);
      const inputRef = useRef(null);

      const saveKey = (k) => { writeKey(k); setApiKey(k); };

      // 🚀 통신 함수 개선: v1 정식 버전 주소 사용 및 상세 로그 출력
      const callGeminiAPI = async (payload) => {
        if (!apiKey) throw new Error("API_KEY_EMPTY");
        
        // 시도해볼 모델 리스트 (가장 흔한 순서)
        const modelsToTry = ["gemini-1.5-flash", "gemini-pro"];
        let lastErrorDetail = "";

        for (const modelName of modelsToTry) {
          // v1beta 대신 v1 정식 주소 시도
          const url = `https://generativelanguage.googleapis.com/v1/models/${modelName}:generateContent?key=${apiKey}`;
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            const responseData = await response.json();

            if (response.ok) {
              return responseData.candidates[0].content.parts[0].text;
            }
            
            // 상세 에러 메시지 추출
            lastErrorDetail = responseData.error ? responseData.error.message : "알 수 없는 에러";
            
            if (response.status === 404) {
              console.warn(`${modelName} 모델을 찾을 수 없습니다.`);
              continue; // 다음 모델로 재시도
            }
            
            throw new Error(lastErrorDetail);
          } catch (error) {
            if (error.message.includes("API key")) throw new Error("API_KEY_INVALID");
            lastErrorDetail = error.message;
          }
        }
        throw new Error(lastErrorDetail || "통신 실패");
      };

      const analyzeFoodCategory = async (foodName) => {
        const systemInstruction = `당신은 초등학교 실과 영양사 선생님입니다. 사용자가 입력한 음식을 '식품 구성 자전거'의 6가지 식품군 중 하나로 분류하고 이모지를 골라주세요. 반드시 JSON 형식으로만 응답하세요: {"category": "분류ID", "emoji": "이모지"}. 
        분류 ID: grain(곡류), veg(채소류), protein(단백질류), fruit(과일류), dairy(유제품류), sugar(유지당류)`;

        const payload = {
          contents: [{ parts: [{ text: `음식: ${foodName}` }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: { responseMimeType: "application/json" }
        };

        const text = await callGeminiAPI(payload);
        const cleanText = text.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(cleanText);
      };

      const evaluateDiet = async () => {
        if (tray.length === 0) return;
        setIsEvaluating(true);
        setEvaluation("");

        const foodNames = tray.map(f => f.name).join(', ');
        const systemInstruction = "당신은 초등학교 영양사 선생님입니다. 5학년 학생이 짠 식단을 보고 칭찬과 조언을 2~3문장으로 다정하게 해주세요.";
        
        const payload = {
          contents: [{ parts: [{ text: `내 식단: [${foodNames}] 건강한가요?` }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
        };

        try {
          const text = await callGeminiAPI(payload);
          setEvaluation(text);
        } catch (error) {
          setEvaluation(`오류 발생: ${friendlyError(error.message)}`);
        } finally {
          setIsEvaluating(false);
        }
      };

      const handleAddFood = async (e) => {
        e.preventDefault();
        const foodName = inputValue.trim();
        if (!foodName) return;
        if (tray.length >= 8) return setErrorMsg("식판이 가득 찼어요!");

        setIsLoading(true);
        setErrorMsg("");

        try {
          const result = await analyzeFoodCategory(foodName);
          setTray([...tray, { id: Date.now().toString(), name: foodName, category: result.category || 'unknown', emoji: result.emoji || '🍽️' }]);
          setInputValue("");
          inputRef.current?.focus();
        } catch (err) {
          setErrorMsg(`분석 실패: ${friendlyError(err.message)}`);
        } finally {
          setIsLoading(false);
        }
      };

      const handleRemoveFood = (foodId) => {
        setTray(tray.filter(item => item.id !== foodId));
        setErrorMsg("");
      };

      useEffect(() => { setEvaluation(""); }, [tray]);

      const counts = {
        grain: tray.filter(f => f.category === 'grain').length,
        veg: tray.filter(f => f.category === 'veg').length,
        protein: tray.filter(f => f.category === 'protein').length,
        fruit: tray.filter(f => f.category === 'fruit').length,
        dairy: tray.filter(f => f.category === 'dairy').length,
        sugar: tray.filter(f => f.category === 'sugar').length,
      };

      const rules = {
        rule1: counts.grain >= 1, 
        rule2: counts.veg >= 2 && counts.veg <= 3, 
        rule3: counts.protein >= 1 && counts.protein <= 2, 
        rule4: (counts.fruit + counts.dairy) >= 1, 
        rule5: counts.sugar === 0, 
      };

      useEffect(() => {
        setIsPerfect(rules.rule1 && rules.rule2 && rules.rule3 && rules.rule4 && rules.rule5);
      }, [rules]);

      if (!apiKey) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">
            <ApiKeyCard onSave={saveKey} />
          </div>
        );
      }

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans text-gray-800 flex flex-col items-center">
          <div className="w-full max-w-6xl space-y-6">
            <header className="relative text-center space-y-3 bg-white p-6 rounded-3xl shadow-sm border border-sky-100">
              <button
                type="button"
                onClick={() => setShowKeyForm(true)}
                title="API 키 바꾸기"
                className="absolute top-4 right-4 text-xs font-bold text-gray-500 hover:text-sky-600 bg-gray-50 hover:bg-sky-50 border border-gray-200 px-3 py-1.5 rounded-full"
              >
                🔑 API 키
              </button>
              <h1 className="text-3xl md:text-4xl font-extrabold text-sky-600 flex items-center justify-center gap-2">
                <span>✨</span> AI와 함께 짜는 균형 잡힌 식단
              </h1>
              <p className="text-gray-600 font-medium">먹고 싶은 메뉴를 입력하면 AI 선생님이 분석해 줍니다!</p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
              <div className="lg:col-span-5 flex flex-col gap-6 w-full">
                <div className="bg-white rounded-3xl shadow-sm p-6 border border-gray-100 w-full">
                  <h2 className="text-xl font-bold mb-4">✍️ 음식 입력</h2>
                  <form onSubmit={handleAddFood} className="flex flex-col gap-3">
                    <input
                      ref={inputRef}
                      type="text"
                      value={inputValue}
                      onChange={(e) => setInputValue(e.target.value)}
                      placeholder="예: 보리밥, 소불고기"
                      className="w-full px-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-sky-400 text-lg"
                    />
                    <button type="submit" disabled={isLoading || !inputValue.trim()} className="w-full bg-sky-500 hover:bg-sky-600 disabled:bg-gray-300 text-white font-bold py-4 rounded-2xl transition-all shadow-sm">
                      {isLoading ? "⏳ AI 분석 중..." : "식판에 담기"}
                    </button>
                  </form>
                  {errorMsg && <div className="mt-4 p-3 bg-red-50 text-red-600 text-sm font-bold rounded-xl break-words">⚠️ {errorMsg}</div>}
                  <div className="mt-6 flex flex-wrap gap-2">
                    {['보리밥', '소불고기', '시금치무침', '배추김치', '사과'].map(item => (
                      <button key={item} type="button" onClick={() => setInputValue(item)} className="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 text-sm rounded-full border border-sky-100">
                        {item}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white rounded-3xl shadow-sm p-6 border border-gray-100 w-full">
                  <h3 className="font-bold text-gray-700 mb-3 text-sm">식품 구성 자전거 색상 안내</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {Object.entries(CATEGORY_MAP).filter(([k]) => k !== 'unknown').map(([key, info]) => (
                      <div key={key} className="flex items-center gap-2 text-sm font-medium">
                        <span className={`w-4 h-4 rounded-full ${info.bg} border-2 ${info.border}`}></span> {info.title}
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-7 flex flex-col gap-6 w-full">
                <div className="bg-white rounded-3xl shadow-sm p-6 border border-gray-100 w-full overflow-hidden">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-bold">🍱 나의 AI 식판 ({tray.length}/8)</h2>
                    <button onClick={() => setTray([])} className="text-sm text-gray-500 hover:text-red-500 bg-gray-50 px-3 py-1.5 rounded-full">🗑️ 비우기</button>
                  </div>
                  <div className="bg-gray-100 rounded-2xl p-4 min-h-[260px] shadow-inner border-4 border-gray-200 flex flex-wrap content-start gap-3">
                    {tray.length === 0 ? (
                      <div className="w-full flex flex-col items-center justify-center text-gray-400 py-10">
                        <span className="text-5xl mb-3 opacity-30">🍴</span>
                        <p className="font-medium">음식을 추가해 보세요!</p>
                      </div>
                    ) : (
                      tray.map(food => {
                        const style = CATEGORY_MAP[food.category] || CATEGORY_MAP.unknown;
                        return (
                          <div key={food.id} onClick={() => handleRemoveFood(food.id)} className={`relative group cursor-pointer w-[90px] h-[95px] rounded-2xl shadow-sm flex flex-col items-center justify-center ${style.bg} border-2 ${style.border} hover:scale-105 transition-transform`}>
                            <span className="text-3xl mb-1">{food.emoji}</span>
                            <span className={`text-[11px] font-bold mt-1 px-1 text-center leading-tight break-words w-full ${style.text}`}>{food.name}</span>
                            <div className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 flex items-center justify-center text-xs w-5 h-5">×</div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                <div className={`rounded-3xl shadow-sm p-6 border-2 transition-colors w-full ${isPerfect ? 'bg-green-50 border-green-400' : 'bg-white border-gray-100'}`}>
                  <h2 className="text-xl font-bold mb-5 flex items-center gap-2">📋 영양 분석</h2>
                  <div className="space-y-3">
                    <RuleRow ok={rules.rule1} title="1. 매끼 곡류 주식 (1개 이상)" count={counts.grain} items={tray.filter(f=>f.category==='grain')} color="text-yellow-600" />
                    <RuleRow ok={rules.rule2} title="2. 매끼 채소류 (2~3가지)" count={counts.veg} items={tray.filter(f=>f.category==='veg')} color="text-green-600" isWarn={counts.veg > 3} />
                    <RuleRow ok={rules.rule3} title="3. 고기·생선·달걀·콩 (1~2가지)" count={counts.protein} items={tray.filter(f=>f.category==='protein')} color="text-red-500" isWarn={counts.protein > 2} />
                    <RuleRow ok={rules.rule4} title="4. 과일/유유 (점심 1개 이상)" count={counts.fruit + counts.dairy} items={tray.filter(f=>f.category==='fruit'||f.category==='dairy')} color="text-blue-500" />
                    <RuleRow ok={rules.rule5} title="5. 당류 자제 (0개 권장)" count={counts.sugar} items={tray.filter(f=>f.category==='sugar')} color="text-gray-500" isWarn={counts.sugar > 0} isSugar={true} />
                  </div>
                  {isPerfect && (
                    <div className="mt-6 p-4 bg-green-500 text-white rounded-2xl text-center font-bold animate-bounce shadow-lg">
                      ✨ 완벽하게 균형 잡힌 식단입니다! ✨
                    </div>
                  )}
                  {tray.length > 0 && (
                    <div className="mt-6 bg-indigo-50 rounded-2xl p-4 border border-indigo-100 w-full">
                      <button onClick={evaluateDiet} disabled={isEvaluating} className="w-full bg-indigo-500 hover:bg-indigo-600 disabled:bg-indigo-300 text-white font-bold py-3 rounded-xl transition-all shadow-sm">
                        {isEvaluating ? "⏳ 분석 중..." : "✨ AI 선생님 한마디 ✨"}
                      </button>
                      {evaluation && (
                        <div className="mt-4 p-4 bg-white rounded-xl border border-indigo-100 text-gray-700 leading-relaxed shadow-inner">
                          <p className="whitespace-pre-wrap">{evaluation}</p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>

          {showKeyForm && (
            <div
              className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
              onClick={(e) => { if (e.target === e.currentTarget) setShowKeyForm(false); }}
            >
              <ApiKeyCard
                initial={apiKey}
                onSave={(k) => { saveKey(k); setShowKeyForm(false); }}
                onCancel={() => setShowKeyForm(false)}
              />
            </div>
          )}
        </div>
      );
    }

    // 키 입력 카드. 첫 실행 화면과 [API 키] 버튼 모달에서 함께 쓴다.
    function ApiKeyCard({ initial = "", onSave, onCancel }) {
      const [value, setValue] = useState(initial);
      const [reveal, setReveal] = useState(false);
      const trimmed = value.trim();

      return (
        <div className="w-full max-w-lg bg-white rounded-3xl shadow-lg border border-sky-100 p-7 space-y-4">
          <h2 className="text-xl font-extrabold text-sky-600 flex items-center gap-2">
            <span>🔑</span> Gemini API 키 입력
          </h2>

          <p className="text-sm text-gray-600 leading-relaxed">
            이 앱은 선생님의 Google AI Studio 키로 동작합니다.
            키는 <b>이 컴퓨터 브라우저에만 저장</b>되고, 다른 곳으로 보내지 않습니다.
          </p>

          <ol className="text-sm text-gray-600 list-decimal pl-5 space-y-1">
            <li>
              <a
                href="https://aistudio.google.com/apikey"
                target="_blank"
                rel="noopener noreferrer"
                className="text-sky-600 underline font-medium"
              >
                aistudio.google.com/apikey
              </a>
              {" "}에 접속합니다.
            </li>
            <li>[Create API key] 를 눌러 키를 만들고 복사합니다.</li>
            <li>아래 칸에 붙여넣고 [저장] 을 누릅니다.</li>
          </ol>

          <div className="space-y-2">
            <input
              type={reveal ? "text" : "password"}
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder="AIza... 로 시작하는 키"
              autoComplete="off"
              spellCheck="false"
              className="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-sky-400 font-mono text-sm"
            />
            <label className="flex items-center gap-2 text-xs text-gray-500">
              <input type="checkbox" checked={reveal} onChange={(e) => setReveal(e.target.checked)} />
              키 보이기
            </label>
          </div>

          <div className="flex gap-2 pt-1">
            {onCancel && (
              <button
                type="button"
                onClick={onCancel}
                className="px-4 py-3 rounded-2xl border-2 border-gray-200 text-gray-600 font-bold hover:bg-gray-50"
              >
                취소
              </button>
            )}
            {onCancel && initial && (
              <button
                type="button"
                onClick={() => onSave("")}
                className="px-4 py-3 rounded-2xl border-2 border-red-200 text-red-500 font-bold hover:bg-red-50"
              >
                키 지우기
              </button>
            )}
            <button
              type="button"
              onClick={() => onSave(trimmed)}
              disabled={!trimmed}
              className="flex-1 bg-sky-500 hover:bg-sky-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-2xl shadow-sm"
            >
              저장하고 시작하기
            </button>
          </div>

          <p className="text-[11px] text-gray-400 leading-relaxed pt-1">
            공용 컴퓨터에서는 쓰고 나서 [키 지우기] 를 눌러주세요.
            키가 새어 나갔다고 생각되면 AI Studio에서 그 키를 지우고 새로 만들면 됩니다.
          </p>
        </div>
      );
    }

    function RuleRow({ ok, title, count, items, color, isWarn = false, isSugar = false }) {
      return (
        <div className="flex justify-between items-center p-3 rounded-xl bg-gray-50 border border-gray-100">
          <div className="flex items-center gap-3">
            <span className="text-xl">{ok ? '✅' : (isSugar ? '❌' : '⚠️')}</span>
            <div>
              <p className={ok ? 'font-bold text-gray-800 text-sm' : 'text-gray-600 text-sm font-medium'}>{title}</p>
              {count > 0 && <p className={`text-[11px] mt-1 break-words ${color}`}>{items.map(f => f.name).join(', ')}</p>}
            </div>
          </div>
          <span className={`text-sm font-bold border px-2 py-1 rounded-lg ${isWarn ? 'bg-red-50 border-red-200 text-red-600' : 'bg-white border-gray-200'}`}>{count}개</span>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
