<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>학교 교육활동 관리</title>
  <meta name="description" content="일일·주간·월간 교육활동을 입력하고, 확인·승인하고, 나이스 결재 문구와 한글 문서로 내보냅니다.">
  <meta name="theme-color" content="#1f5eff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="교육활동">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <noscript>이 앱은 자바스크립트가 필요합니다. 크롬 또는 엣지로 열어주세요.</noscript>
  </div>

  <!--
    index.html 을 그냥 더블클릭해서 열면(file:// 주소) 브라우저 보안 규칙상
    자바스크립트 모듈을 못 읽어 빈 화면만 나온다. 원인을 알려준다.
  -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = [
        '<div class="boot-help">',
        '<h1>주소가 <code>file://</code> 로 열렸습니다</h1>',
        '<p>브라우저 보안 규칙 때문에 이렇게 열면 앱이 동작하지 않습니다.',
        ' 파일을 더블클릭하는 대신 아래 둘 중 하나로 열어주세요.</p>',
        '<h2>가장 쉬운 방법</h2>',
        '<p>저장소 맨 위 폴더의 <code>start-windows.bat</code>',
        ' (맥·리눅스는 <code>start-mac-linux.command</code>) 을 더블클릭하세요.',
        ' 작은 서버가 뜨고 브라우저가 자동으로 열립니다.</p>',
        '<h2>직접 실행</h2>',
        '<pre>cd app\npython3 -m http.server 8000</pre>',
        '<p>그다음 브라우저에서 <code>http://localhost:8000</code> 을 엽니다.</p>',
        '<p class="boot-note">인터넷 주소(https://)로 올려두면 이 과정도 필요 없고,',
        ' 바탕화면 설치와 휴대전화 사용도 됩니다.</p>',
        '</div>',
      ].join('');
    }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
